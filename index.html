<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JustTalk Akıllı Asistan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .mic-btn { transition: all 0.3s ease; box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5); }
        .mic-btn:active { transform: scale(0.95); }
        
        /* Dinliyor Animasyonu (Kırmızı) */
        .listening { animation: pulseRed 1.5s infinite; background-color: #ef4444 !important; box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.5); }
        @keyframes pulseRed {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Yapay Zeka Düşünüyor Animasyonu (Mor) */
        .thinking { animation: pulsePurple 1.5s infinite; background-color: #8b5cf6 !important; box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.5); pointer-events: none; }
        @keyframes pulsePurple {
            0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(139, 92, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
        }

        .reminder-card { transition: all 0.2s ease; border: 1px solid #1e293b; background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%); }
        .reminder-card.completed p.main-text { text-decoration: line-through; color: #64748b; }
        .delete-btn { opacity: 0; transition: opacity 0.2s; }
        .reminder-card:hover .delete-btn { opacity: 1; }
    </style>
</head>
