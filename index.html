<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JustTalk Anımsatıcı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .mic-btn { transition: all 0.3s ease; }
        .listening { animation: pulse 1.5s infinite; background-color: #ef4444 !important; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="flex flex-col h-screen p-4">
    <div class="pt-8 pb-4">
        <h1 class="text-3xl font-bold text-center">JustTalk</h1>
    </div>

    <div class="flex-1 overflow-y-auto" id="remindersList">
        <p class="text-gray-400 text-center mt-10">Henüz anımsatıcı yok. Eklemek için mikrofona dokun.</p>
    </div>

    <div class="p-6 flex justify-center items-center pb-12">
        <button id="micBtn" class="mic-btn bg-blue-600 rounded-full w-20 h-20 flex justify-center items-center shadow-lg">
            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
        </button>
    </div>

    <script type="module">
        // Firebase kütüphanelerini çağırıyoruz
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // Senin ilettiğin anahtar
        const firebaseConfig = {
            apiKey: "AIzaSyD4ZwCI4_e1D8bWfigQ4MAozrC5ZaDDv9A",
            authDomain: "justtalk-ce472.firebaseapp.com",
            projectId: "justtalk-ce472",
            storageBucket: "justtalk-ce472.firebasestorage.app",
            messagingSenderId: "620968449353",
            appId: "1:620968449353:web:f6719c170e432b7c0fb698"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const remindersRef = collection(db, "reminders");
        const q = query(remindersRef, orderBy("createdAt", "desc"));

        const micBtn = document.getElementById('micBtn');
        const list = document.getElementById('remindersList');

        // Ses tanıma motoru
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) { alert("Tarayıcınız ses tanımayı desteklemiyor. Lütfen Safari kullanın."); }
        
        const recognition = new SpeechRecognition();
        recognition.lang = 'tr-TR';

        recognition.onstart = () => { micBtn.classList.add('listening'); };
        recognition.onend = () => { micBtn.classList.remove('listening'); };
        
        recognition.onresult = async (event) => {
            const text = event.results[0][0].transcript.toLowerCase();
            
            // Basit kelime analizi ile kategori ve zaman ayıklama
            let time = "Zaman belirtilmedi";
            let category = "Genel";
            
            if(text.includes("yarın")) time = "Yarın";
            if(text.includes("bugün")) time = "Bugün";
            const saatMatch = text.match(/saat (\d+)/);
            if(saatMatch) time += " " + saatMatch[0];
            
            if(text.includes("toplantı") || text.includes("iş") || text.includes("çalışma") || text.includes("ders")) category = "İş / Okul";
            if(text.includes("kahve") || text.includes("kitap") || text.includes("film") || text.includes("oyun")) category = "Dinlenme / Hobi";
            if(text.includes("market") || text.includes("alınacak")) category = "Alışveriş";

            // Veritabanına kaydet
            await addDoc(remindersRef, {
                text: text,
                time: time,
                category: category,
                createdAt: serverTimestamp()
            });
        };

        micBtn.addEventListener('click', () => { recognition.start(); });

        // Veritabanını canlı olarak dinle ve ekrana yazdır
        onSnapshot(q, (snapshot) => {
            list.innerHTML = '';
            if(snapshot.empty) {
                list.innerHTML = '<p class="text-gray-400 text-center mt-10">Henüz anımsatıcı yok. Eklemek için mikrofona dokun.</p>';
                return;
            }
            snapshot.forEach((doc) => {
                const data = doc.data();
                list.innerHTML += `
                    <div class="bg-gray-800 p-4 rounded-2xl mb-3 shadow-lg mx-2 border border-gray-700">
                        <div class="flex justify-between items-center mb-2">
                            <span class="bg-blue-500/20 text-blue-400 text-xs px-3 py-1 rounded-full font-semibold tracking-wide">${data.category}</span>
                            <span class="text-gray-400 text-sm flex items-center gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                ${data.time}
                            </span>
                        </div>
                        <p class="text-lg font-medium tracking-tight mt-1">${data.text.charAt(0).toUpperCase() + data.text.slice(1)}</p>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
