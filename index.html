
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JustTalk AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            text-align: center;
            padding: 20px 0 10px 0;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #statusText {
            font-size: 0.85rem;
            color: #c084fc;
            min-height: 20px;
            margin-top: 4px;
            font-weight: 500;
        }
        #remindersList {
            flex: 1;
            margin: 16px 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .reminder-card {
            background: #161f30;
            border: 1px solid #23324d;
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .reminder-card.completed .main-text {
            text-decoration: line-through;
            color: #64748b;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .category-badge {
            background: rgba(168, 85, 247, 0.15);
            color: #d8b4fe;
            border: 1px solid rgba(168, 85, 247, 0.3);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .time-badge {
            color: #94a3b8;
            font-size: 0.8rem;
        }
        .main-text {
            font-size: 1.05rem;
            line-height: 1.4;
            cursor: pointer;
        }
        .btn-delete {
            background: none;
            border: none;
            color: #f87171;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px;
        }
        .controls-wrapper {
            padding: 16px 0 24px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #micBtn {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: none;
            background: #2563eb;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        #micBtn:active { transform: scale(0.92); }
        #micBtn.listening {
            background: #ef4444 !important;
            box-shadow: 0 0 0 16px rgba(239, 68, 68, 0.25);
            animation: pulseRed 1.2s infinite;
        }
        #micBtn.thinking {
            background: #9333ea !important;
            box-shadow: 0 0 0 16px rgba(147, 51, 234, 0.25);
            animation: pulsePurple 1.2s infinite;
        }
        @keyframes pulseRed {
            0% { transform: scale(0.96); }
            50% { transform: scale(1.04); }
            100% { transform: scale(0.96); }
        }
        @keyframes pulsePurple {
            0% { transform: scale(0.96); }
            50% { transform: scale(1.04); }
            100% { transform: scale(0.96); }
        }
    </style>
</head>
<body>
    <header>
        <h1>JustTalk AI</h1>
        <div id="statusText"></div>
    </header>

    <div id="remindersList">
        <p style="text-align: center; color: #64748b; margin-top: 30px;">Kayıtlar yükleniyor...</p>
    </div>

    <div class="controls-wrapper">
        <button id="micBtn" type="button" aria-label="Konuş">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4ZwCI4_e1D8bWfigQ4MAozrC5ZaDDv9A",
            authDomain: "justtalk-ce472.firebaseapp.com",
            projectId: "justtalk-ce472",
            storageBucket: "justtalk-ce472.firebasestorage.app",
            messagingSenderId: "620968449353",
            appId: "1:620968449353:web:f6719c170e432b7c0fb698"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const remindersRef = collection(db, "reminders");
        const q = query(remindersRef, orderBy("createdAt", "desc"));

        const GEMINI_API_KEY = "AQ.Ab8RN6LItTWeUweYOBqGEUxYAaxsYSXiX6RxLx_5ZUHM22bEYA";

        const micBtn = document.getElementById('micBtn');
        const list = document.getElementById('remindersList');
        const statusText = document.getElementById('statusText');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                micBtn.className = 'listening';
                statusText.innerText = "Dinleniyor...";
            };

            recognition.onend = () => {
                if (micBtn.className === 'listening') {
                    micBtn.className = '';
                    statusText.innerText = "";
                }
            };

            recognition.onerror = (e) => {
                micBtn.className = '';
                statusText.innerText = "Ses algılanamadı (" + e.error + ")";
            };

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                micBtn.className = 'thinking';
                statusText.innerText = "Yapay zeka ayrıştırıyor...";

                try {
                    const prompt = `Aşağıdaki kullanıcı komutunu anla. SADECE geçerli bir JSON döndür. Başka hiçbir metin veya markdown bloğu yazma.
Format:
{"text": "yapılacak ana iş", "time": "bahsedilen saat veya gün", "category": "kullanıcı belirttiyse o kategori, belirtmediyse bağlama en uygun kısa kategori"}

Kullanıcı sözü: "${transcript}"`;

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    const aiData = await response.json();
                    let aiText = aiData.candidates[0].content.parts[0].text;
                    const parsed = JSON.parse(aiText);

                    await addDoc(remindersRef, {
                        text: parsed.text || transcript,
                        time: parsed.time || "Zaman belirtilmedi",
                        category: parsed.category || "Genel",
                        completed: false,
                        createdAt: serverTimestamp()
                    });
                    statusText.innerText = "";
                } catch (err) {
                    console.error("Hata:", err);
                    statusText.innerText = "Analiz yapılamadı, doğrudan kaydediliyor...";
                    await addDoc(remindersRef, {
                        text: transcript,
                        time: "Zaman belirtilmedi",
                        category: "Genel",
                        completed: false,
                        createdAt: serverTimestamp()
                    });
                } finally {
                    micBtn.className = '';
                }
            };
        } else {
            statusText.innerText = "Tarayıcınız ses tanımayı desteklemiyor.";
        }

        micBtn.addEventListener('click', () => {
            if (!recognition) {
                alert("Tarayıcınız ses özelliğini desteklemiyor. Lütfen Safari üzerinden açın.");
                return;
            }
            try {
                recognition.start();
            } catch (err) {
                recognition.stop();
            }
        });

        window.toggleComplete = async (id, currentState) => {
            await updateDoc(doc(db, "reminders", id), { completed: !currentState });
        };

        window.deleteReminder = async (id) => {
            if (confirm("Bu anımsatıcıyı silmek istiyor musunuz?")) {
                await deleteDoc(doc(db, "reminders", id));
            }
        };

        onSnapshot(q, (snapshot) => {
            list.innerHTML = '';
            if (snapshot.empty) {
                list.innerHTML = '<p style="text-align: center; color: #64748b; margin-top: 40px;">Henüz anımsatıcı yok.<br>Konuşmak için mikrofona bas.</p>';
                return;
            }
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                const completedClass = data.completed ? 'completed' : '';

                list.innerHTML += `
                    <div class="reminder-card ${completedClass}">
                        <div class="card-header">
                            <span class="category-badge">${data.category}</span>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span class="time-badge">${data.time}</span>
                                <button class="btn-delete" onclick="deleteReminder('${id}')">✕</button>
                            </div>
                        </div>
                        <div class="main-text" onclick="toggleComplete('${id}', ${data.completed})">${data.text}</div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
